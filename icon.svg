<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1c1108"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#f6a623"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- handle -->
  <path d="M300 210 q86 6 86 76 t-86 76" fill="none" stroke="url(#beer)" stroke-width="34" stroke-linecap="round"/>

  <!-- mug body -->
  <rect x="150" y="186" width="158" height="226" rx="26" fill="url(#beer)"/>
  <!-- glass highlight -->
  <rect x="172" y="214" width="26" height="160" rx="13" fill="#fff4d6" opacity=".35"/>

  <!-- foam -->
  <g fill="#fff4d6">
    <rect x="146" y="150" width="166" height="52" rx="26"/>
    <circle cx="172" cy="156" r="30"/>
    <circle cx="218" cy="142" r="34"/>
    <circle cx="266" cy="150" r="30"/>
    <circle cx="300" cy="160" r="24"/>
  </g>
</svg>
